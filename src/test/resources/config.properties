# ---------------------------------------------------------------------------
# Flipkart Automation Framework - environment configuration
# ---------------------------------------------------------------------------

# Browser to launch: chrome | firefox
browser=chrome

# Run without a visible browser window (useful for CI). true | false
headless=false

# Base URL under test
url=https://www.flipkart.com

# Implicit wait applied once at driver startup (seconds)
implicitWait=10

# Path to the Excel data-driven test file, relative to the project root
excelPath=src/test/resources/testdata/SearchData.xlsx
