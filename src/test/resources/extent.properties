# ---------------------------------------------------------------------------
# Configuration for tech.grasshopper:extentreports-cucumber7-adapter.
# Read automatically by ExtentCucumberAdapter (wired into TestRunner's
# @CucumberOptions plugin list) - no extra code needed to load this file.
# ---------------------------------------------------------------------------

# Spark HTML reporter
extent.reporter.spark.start=true
extent.reporter.spark.out=test-output/ExtentReport.html

# Where screenshots referenced by the report are read from / written to
screenshot.dir=test-output/screenshots/
screenshot.rel.path=screenshots/

# Free-form key/value pairs shown in the report's "System Info" panel.
# Any key prefixed with "systeminfo." (mind the trailing dot) is picked up.
systeminfo.Project=Flipkart Automation Framework
systeminfo.Environment=QA
